<script>
/* ===== НАСТРОЙКИ =====
 CFG.API — адрес твоего сервера (Py-скрипт), например 'https://api.твойдомен.com'. Без него игра не запустится.
 Сервер хранит ВСЁ (монеты, инвентарь, дропы, промо, админов) и сам крутит рандом — клиент только показывает анимации.
 API (POST JSON, в каждом запросе есть initData): /api/init /api/open /api/upgrade /api/sell /api/promo /api/feed /api/admin */
const CFG={API:'',CH:'https://t.me/BrainrotBro67',CHN:'@BrainrotBro67',CASE_MS:4000,UP_MS:6000,BONUS_MS:4000,POLL:2000,MIN_COIN:5};
const A={logo:'other/3b50ecaa-8fb3-4c6f-86fb-bef7abc202b1.png',coin:'other/cecc3710-4c97-4639-8760-c443546b4036.png',free:'other/aed80e49-c1b1-4a32-8b23-9de09e458cd2.png',spin:'other/wheel-of-fortune.mp3',end:'other/45435a970c52904.mp3'};
const T={coin:['#ffd54a','#ffd54a99','Монеты'],c:['#8fb8d9','#8fb8d980','Обычный'],u:['#4fe08a','#4fe08a80','Необычный'],r:['#3d9bff','#3d9bff80','Редкий'],e:['#a86bff','#a86bff80','Эпический'],l:['#ff5fb8','#ff5fb880','Легендарный'],m:['#ff7a3d','#ff7a3d80','Мифический'],s:['#36f0ff','#36f0ff80','Секретный'],d:['#ffd23f','#ffd23fb0','Божественный'],x:['#e3b6ff','#e3b6ffb0','Кристальный']};
/* несколько имён через | — если первого файла нет, берётся следующее */
{id:'s67',v:20,name:'67',img:'other/67_in_SAB.webp',t:'r'},
{id:'brr',v:20,name:'Brr Brr Patapim',img:'other/Lil_wayne.webp',t:'r'},
{id:'l67',v:45,name:'Los 67',img:'other/Los_67__1_.webp',t:'e'},
{id:'bal',v:50,name:'Ballerina Cappuccina',img:'other/Ballerina_Cappucina.webp',t:'e'},
{id:'n25',v:50,name:'25',img:'other/25.webp',t:'e'},
{id:'l25',v:67,name:'Los 25',img:'other/Los_25.webp',t:'l'},
{id:'sah',v:85,name:'Te Te Te Sahur',img:'other/Te_Te_Te_Sahur.webp',t:'l'},
{id:'ale',v:120,name:'Alessio',img:'other/Alessio.webp',t:'m'},
{id:'vac',v:150,name:'La Vacca Saturno Saturnita',img:'other/La_Vacca_Saturno_Saturnita.webp',t:'s'},
{id:'gar',v:350,name:'Garama and Madundung',img:'other/Garamadundung__1__1.webp|other/Garamadundung__1_.webp',t:'d'},
{id:'f67',v:367,name:'Festive 67',img:'other/Festive_67.webp',t:'d'},
{id:'cf67',v:1400,name:'Crystal Festive 67',img:'other/Crystal_Festive_67.webp',t:'x'}];
const BY=Object.fromEntries(IT.map(i=>[i.id,i]));
/* кейсы отсортированы по цене: сверху дешевле. Шансы здесь — для показа; реальный розыгрыш на сервере (с теми же цифрами) */
const CASES=[
{id:'free',name:'Бесплатный кейс',img:A.free,price:0,sub:true,drops:[['c2',85],['noob',5],['tric',3],['brr',2],['bal',1],['sah',.5],['ale',.15],['vac',.08],['gar',.001]]},
{id:'cheap',name:'Малостоющий кейс',img:'other/60f1cad3-97d4-4536-bc98-7dfa161691bc.png',price:5,drops:[['c2',50],['noob',25],['tric',5],['s67',1],['bal',.2],['gar',.1]]},
{id:'c67',name:'67 Кейс',img:'other/ebf8de85-e0ee-43d1-9144-793b9562ba84.png',price:25,drops:[['noob',65],['s67',5],['l67',3],['n25',1],['l25',.5],['f67',.1],['cf67',.01]]}];

function snd(k,ms){if(!snd_)return;const a=au[k];try{a.currentTime=0;a.volume=1;a.play().catch(()=>{});if(ms)setTimeout(()=>fade(a),ms-250)}catch(e){}}
function fade(a){let v=1;const t=setInterval(()=>{v-=.1;if(v<=.05){clearInterval(t);a.pause();a.volume=1}else a.volume=v},25)}
$('#sndB').textContent=snd_?'🔊':'🔇';$('#sndB').onclick=()=>{snd_=!snd_;localStorage.setItem('bb_snd',snd_?'1':'0');$('#sndB').textContent=snd_?'🔊':'🔇'};

/* ===== UI ===== */
function setBal(an){const el=$('#bal'),to=S.bal,from=shown,t0=performance.now();if(!an){shown=to;el.textContent=fmt(to);return}
 $('#pill').classList.remove('bump');void $('#pill').offsetWidth;$('#pill').classList.add('bump');
 (function f(t){const k=Math.min(1,(t-t0)/600);shown=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));el.textContent=fmt(shown);if(k<1)requestAnimationFrame(f)})(t0)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('on');void t.offsetWidth;t.classList.add('on')}
function modal(h,btns){const m=$('#modal');m.innerHTML=`<div class="mc">${h}<div class="mb"></div></div>`;const b=m.querySelector('.mb');btns.forEach(([t,c,f])=>{const e=document.createElement('button');e.className='btn '+c;e.innerHTML=t;e.onclick=()=>f(e);b.appendChild(e)});m.classList.add('on')}
const closeM=()=>$('#modal').classList.remove('on');$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
function reveal({tone,title,item,sub,btns}){const r=$('#rv'),c=tone=='lose'?['#ff4d5e','#ff4d5e80']:T[item.t];
 r.classList.toggle('lose',tone=='lose');r.style.setProperty('--c',c[0]);r.style.setProperty('--g',c[1]);
 $('#rvT').textContent=title;$('#rvI').innerHTML=img(item.img);$('#rvN').textContent=item.name;$('#rvV').textContent=sub;
 $('#sp').innerHTML=Array.from({length:28},()=>{const a=rnd()*6.28,d=90+rnd()*150;return `<i style="--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--dl:${rnd()*.25}s"></i>`}).join('');
 const b=$('#rvB');b.innerHTML='';btns.forEach(([t,cl,f])=>{const e=document.createElement('button');e.className='btn '+cl;e.textContent=t;e.onclick=f;b.appendChild(e)});r.classList.add('on')}
const closeRv=()=>$('#rv').classList.remove('on');
const promoBox=()=>`<div class="glass af"><label>Промокод</label><input class="pr-in" placeholder="Введи промокод" autocomplete="off" autocapitalize="off"><button class="btn gold pr-btn">Ввести промокод</button></div>`;

/* ===== МЕНЮ / НАВИГАЦИЯ ===== */
 if(S.bal<c.price){shake(b);toast('Не хватает монет: нужно '+fmt(c.price));return}
 busy=true;b.textContent='Открываем…';
 const r=await api('/api/open',{case:c.id});
 if(!r.ok){busy=false;if(r.freeAt)S.freeAt=r.freeAt;updOpenBtn();if(r.err=='nosub')subModal();else{shake(b);toast(r.msg||'Ошибка')}return}
 S.bal=r.bal;S.inv=r.inv;S.freeAt=r.freeAt||S.freeAt;
 try{await spinCase(c,BY[r.drop])}catch(e){console.error(e)}
 busy=false;updOpenBtn()}
async function spinCase(c,win){
 const W=46,N=56,st=112,cw=104,vis=c.drops.map(d=>[d[0],Math.sqrt(d[1])]),s=$('#strip');
 s.style.transform='';s.innerHTML=Array.from({length:N},(_,i)=>{const it=BY[i==W?win.id:pick(vis)];return `<div class="rc" style="--c:${T[it.t][0]};--g:${T[it.t][1]}">${img(it.img)}<b>${it.name}</b></div>`}).join('');
 $('#opName').textContent=c.name;$('#op').classList.add('on');await sleep(350);
 const ww=$('#win').clientWidth,x0=3*st+cw/2-ww/2,x1=W*st+cw/2-ww/2+(rnd()*60-30);
 snd('spin',CFG.CASE_MS);
 const an=s.animate([{transform:`translateX(${-x0}px)`},{transform:`translateX(${-x1}px)`}],{duration:CFG.CASE_MS,easing:'cubic-bezier(.12,.62,.08,1)',fill:'forwards'});
 let last=-1,prev=null;const kids=s.children;
 (function tick(){if(an.playState!='running')return;const m=new DOMMatrix(getComputedStyle(s).transform),i=Math.floor((-m.m41+ww/2)/st);if(i!=last&&kids[i]){last=i;hap('light');if(prev)prev.classList.remove('hot');prev=kids[i];prev.classList.add('hot')}requestAnimationFrame(tick)})();
 await an.finished.catch(()=>{});
 s.style.transform=`translateX(${-x1}px)`;an.cancel();if(prev)prev.classList.remove('hot');
 snd('end');kids[W].classList.add('win');hap('heavy');await sleep(900);
 const done=()=>{closeRv();$('#op').classList.remove('on');setBal(true)};
 reveal({tone:'drop',title:win.coin?'Монеты!':'Тебе выпало',item:win,sub:win.coin?`+${win.coin} ${pl(win.coin)} на баланс`:`${T[win.t][2]} · стоимость ${fmt(win.v)}`,
  btns:[['Забрать','green',done],['Открыть ещё','gold',()=>{done();openCase()}]]})}

 else toast(({promo_invalid:'Промокод недействителен',promo_expired:'Промокод закончился — активации исчерпаны',promo_used:'Ты уже активировал этот промокод'})[r.err]||r.msg||'Ошибка')});

/* ===== АПГРЕЙДЕР ===== */
const sVal=()=>up.s?(up.s.k=='i'?BY[up.s.id].v:up.s.n):0;
const chOf=(sv,tv)=>Math.round(sv/tv*8500)/100;   /* 85% от отношения ставка/цель (чуть в пользу казино) — то же считает сервер */
const okCh=c=>c>.99&&c<61;
const sItem=()=>up.s&&(up.s.k=='i'?BY[up.s.id]:{id:'coins',name:up.s.n+' '+pl(up.s.n),img:A.coin,v:up.s.n,t:'coin'});
const targets=sv=>IT.filter(i=>!i.coin&&i.v>sv&&okCh(chOf(sv,i.v)));
function slot(sel,i,l){$(sel).innerHTML=i?`${img(i.img)}<span>${i.name}</span><em>${fmt(i.v)}</em>`:`<span class="plus">+</span><span>${l}</span>`}
function setWheel(ch,gold){const arc=2*Math.PI*82;$('#gArc').setAttribute('stroke-dasharray',`${arc*ch/100} ${arc}`);$('#gold').setAttribute('stroke-dasharray',gold?`${arc*.05} ${arc}`:`0 ${arc}`)}
function renderUp(){
 const sv=sVal();if(up.t&&(!sv||BY[up.t].v<=sv||!okCh(chOf(sv,BY[up.t].v))))up.t=null;
 const si=sItem(),ti=BY[up.t],ok=si&&ti,ch=ok?chOf(sv,ti.v):0,good=ok&&okCh(ch);
 $('#wPct').textContent=ok?ch+'%':'?';$('#wPct').classList.toggle('bad',ok&&!good);$('#wSm').textContent=ok&&!good?'нельзя':'шанс';setWheel(ch,false);$('#wheel').classList.toggle('empty',!ok);
 slot('#sS',si,'Ставка');slot('#sT',ti,'Цель');$('#mult').textContent=ok?'x'+(+(ti.v/sv).toFixed(2)):'';
 $('#upBtn').classList.toggle('off',!good);[0,1,2].forEach(k=>$('#p'+k).classList.toggle('on',up.pane==k));
 let h='';
 if(up.pane==0){const inv=Object.keys(S.inv).filter(k=>S.inv[k]>0&&BY[k]).map(k=>BY[k]).sort((a,b)=>a.v-b.v);
  h=inv.length?inv.map(i=>card(i,`<u>×${S.inv[i.id]}</u>`,up.s&&up.s.k=='i'&&up.s.id==i.id?'sel':'')).join(''):'<div class="empty">У тебя пока нет брейнротов.<br>Открой кейс — они появятся тут!</div>'}
 else if(up.pane==1)h=`<div class="cp"><div class="sub" style="margin:0">Баланс: ${fmt(S.bal)}. Минимум ${CFG.MIN_COIN}. Монеты можно ставить только на брейнротов.</div><input id="cIn" type="number" inputmode="numeric" min="${CFG.MIN_COIN}" value="${up.s&&up.s.k=='c'?up.s.n:up.coins}"><div class="chips">${[5,10,25,50].map(n=>`<button class="chip" data-n="${n}">${n}</button>`).join('')}<button class="chip" data-n="${S.bal}">Всё</button></div><button class="btn blue" id="cOk">Поставить монеты</button></div>`;
 else if(!si)h='<div class="empty">Сначала выбери ставку — тогда покажу подходящие цели.</div>';
 else{const l=targets(sv);h=l.length?l.map(i=>card(i,`<s>${chOf(sv,i.v)}%</s>`,up.t==i.id?'sel':'')).join(''):'<div class="empty">Для этой ставки нет целей с шансом от 1% до 60%.</div>'}
 $('#pick').innerHTML=h}
$('#sS').onclick=()=>{up.pane=up.s&&up.s.k=='c'?1:0;renderUp()};$('#sT').onclick=()=>{up.pane=2;renderUp()};[0,1,2].forEach(k=>$('#p'+k).onclick=()=>{up.pane=k;renderUp()});
$('#pick').onclick=e=>{if(busy)return;
 const c=e.target.closest('.ic');if(c){const id=c.dataset.id;if(up.pane==0){up.s={k:'i',id};up.pane=2}else up.t=id;hap();renderUp();return}
 const ch=e.target.closest('.chip');if(ch){$('#cIn').value=ch.dataset.n;return}
 if(e.target.id=='cOk'){const n=Math.floor(+$('#cIn').value);if(!(n>=CFG.MIN_COIN)){toast('Минимум '+CFG.MIN_COIN+' монет');return}if(n>S.bal){toast('Не хватает монет');return}up.coins=n;up.s={k:'c',n};up.pane=2;hap();renderUp()}};
$$('.qb').forEach(b=>b.onclick=()=>{if(busy)return;const sv=sVal();if(!sv){toast('Сначала выбери ставку');return}
 const l=targets(sv);if(!l.length){toast('Для этой ставки нет подходящих целей');return}const w=+b.dataset.p;let best=l[0];l.forEach(i=>{if(Math.abs(chOf(sv,i.v)-w)<Math.abs(chOf(sv,best.v)-w))best=i});
 up.t=best.id;up.pane=2;hap();renderUp()});
async function turn(to,ms){const nd=$('#needle'),t=ang+2160+(((to-ang)%360)+360)%360;
 const an=nd.animate([{transform:`rotate(${ang}deg)`},{transform:`rotate(${t}deg)`}],{duration:ms,easing:'cubic-bezier(.15,.6,.1,1)',fill:'forwards'});
 await an.finished.catch(()=>{});ang=t%360;nd.style.transform=`rotate(${ang}deg)`;an.cancel()}
function pickAngle(ch,gold,hit,won){const a=ch*3.6,G0=160,G1=200;
 if(hit)return 166+rnd()*28;
 for(let i=0;i<60;i++){const x=won?a*(.08+.84*rnd()):a+(360-a)*(.08+.84*rnd());if(!(gold&&x>G0&&x<G1))return x}
 return won?a*.1:a+(360-a)*.1}
$('#upBtn').onclick=async()=>{
 if(busy)return;const sv=sVal(),t=BY[up.t];
 if(!sv||!t){shake($('#upBtn'));toast('Выбери ставку и цель');return}
 const ch=chOf(sv,t.v);if(!okCh(ch)){shake($('#upBtn'));toast('Шанс должен быть от 1% до 60%');return}
function renderProf(){
 const name=[TU.first_name,TU.last_name].filter(Boolean).join(' ')||'Игрок';
 const inv=Object.keys(S.inv).filter(k=>S.inv[k]>0&&BY[k]).map(k=>BY[k]).sort((a,b)=>b.v-a.v),cnt=inv.reduce((s,i)=>s+S.inv[i.id],0),val=inv.reduce((s,i)=>s+S.inv[i.id]*i.v,0);
 $('#pgP').innerHTML=`<h1>Профиль</h1><div class="glass pf" style="margin-top:10px"><div class="av"><span>${esc(name[0].toUpperCase())}</span>${TU.photo_url?`<img src="${esc(TU.photo_url)}" onerror="this.remove()">`:''}</div><div><h2>${esc(name)}</h2><small>${TU.username?'@'+esc(TU.username):'ID '+(TU.id||'')}</small></div></div>
 ${ME.is_admin?'<button class="btn gold big" id="admBtn">Админка</button>':''}
 <h3 class="sec">Инвентарь · ${cnt} шт. · ${coin} ${fmt(val)}</h3><div class="grid" id="inv">${inv.length?inv.map(i=>card(i,`<u>×${S.inv[i.id]}</u>`)).join(''):'<div class="empty">Тут пусто. Открой кейс — и брейнроты появятся!</div>'}</div>`;
 if($('#admBtn'))$('#admBtn').onclick=admin;$('#inv').onclick=e=>{const c=e.target.closest('.ic');if(c)itemModal(c.dataset.id)}}
function itemModal(id){const i=BY[id],n=S.inv[id];if(!n)return;
 modal(`${img(i.img)}<h2>${i.name}</h2><p>${T[i.t][2]} · ${coin} ${fmt(i.v)}</p>`,[[`Продать за ${coin} ${fmt(i.v)}`,'gold',()=>sell(id,1)],...(n>1?[[`Продать все ×${n} за ${coin} ${fmt(i.v*n)}`,'red',()=>sell(id,n)]]:[]),['Закрыть','ghost',closeM]])}
async function sell(id,n){closeM();const r=await api('/api/sell',{id,n});if(!r.ok){toast(r.msg||'Ошибка');return}
 const g=r.bal-S.bal;S.bal=r.bal;S.inv=r.inv;setBal(true);renderProf();toast(`+${fmt(g)} ${pl(g)}`);hap('medium')}

/* ===== АДМИНКА ===== */
const ATABS=[['coins','Монеты'],['wipe','Очистка'],['pnew','Новый промо'],['plist','Мои промо'],['aadd','Выдать админку',1],['alist','Админы',1],['maint','Тех. работы',1]];
function admin(){const a=$('#adm');a.classList.add('on');
 a.innerHTML=`<div class="ah"><button class="btn ghost sm" id="aX">‹ Назад</button><h2>Админка</h2></div><div class="atabs">${ATABS.filter(t=>!t[2]||ME.is_owner).map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div id="apane"></div>`;
 $('#aX').onclick=()=>a.classList.remove('on');a.querySelector('.atabs').onclick=e=>{const b=e.target.closest('button');if(b)aTab(b.dataset.t)};aTab('coins')}
async function adm(act,d,ok){const r=await api('/api/admin',Object.assign({act},d));toast(r.ok?(ok||'Готово'):(r.msg||'Ошибка'));return r}
async function aTab(t){
 $$('#adm .atabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));const p=$('#apane');
 const f=(l,id,ph,ty='text')=>`<label>${l}</label><input id="${id}" type="${ty}" placeholder="${ph}" autocomplete="off" autocapitalize="off">`,box=h=>`<div class="glass af">${h}</div>`,v=id=>$('#'+id).value.trim();
 if(t=='coins'){p.innerHTML=box(f('Никнейм игрока','a1','@username')+f('Количество монет','a2','100','number')+'<button class="btn green" id="ago" style="margin-top:6px">Выдать</button>');
  $('#ago').onclick=async()=>{const r=await adm('grant',{nick:v('a1'),amount:Math.floor(+v('a2'))},'Монеты выданы');if(r.ok){if(r.self){S.bal=r.bal;setBal(true)}$('#a2').value=''}}}
 else if(t=='wipe'){p.innerHTML=box(f('Никнейм игрока','a1','@username')+'<button class="btn red" id="ago" style="margin-top:6px">Очистить инвентарь и монеты</button>');
  $('#ago').onclick=()=>{const n=v('a1');if(!n){toast('Укажи никнейм');return}modal(`<h2>Очистить игрока?</h2><p>У ${esc(n)} обнулятся монеты и инвентарь. Это нельзя отменить.</p>`,[['Очистить','red',async()=>{closeM();const r=await adm('wipe',{nick:n},'Игрок очищен');if(r.ok&&r.self){S.bal=0;S.inv={};setBal(true)}}],['Отмена','ghost',closeM]])}}
 else if(t=='pnew'){p.innerHTML=box(f('Промокод','a1','SUMMER')+f('Количество активаций (людей)','a2','10','number')+f('Монет за активацию','a3','50','number')+'<button class="btn green" id="ago" style="margin-top:6px">Создать промокод</button>');
  $('#ago').onclick=async()=>{const r=await adm('promo_add',{code:v('a1'),uses:Math.floor(+v('a2')),coins:Math.floor(+v('a3'))},'Промокод создан');if(r.ok)['a1','a2','a3'].forEach(i=>$('#'+i).value='')}}
 else if(t=='plist'){p.innerHTML='<div class="empty">Загрузка…</div>';const r=await api('/api/admin',{act:'promo_list'});
  p.innerHTML=r.ok?(r.promos.length?r.promos.map(x=>`<div class="row"><span><b>${esc(x.code)}</b> · ${fmt(x.coins)} ${pl(x.coins)}</span><span>${x.used}/${x.uses}</span></div>`).join(''):'<div class="empty">Промокодов пока нет</div>'):`<div class="empty">${r.msg||'Ошибка'}</div>`}
 else if(t=='aadd'){p.innerHTML=box(f('Никнейм игрока','a1','@username')+'<button class="btn green" id="ago" style="margin-top:6px">Выдать админку</button>');$('#ago').onclick=async()=>{const r=await adm('admin_add',{nick:v('a1')},'Админка выдана');if(r.ok)$('#a1').value=''}}
 else if(t=='alist'){p.innerHTML='<div class="empty">Загрузка…</div>';const r=await api('/api/admin',{act:'admin_list'});
  if(!r.ok){p.innerHTML=`<div class="empty">${r.msg||'Ошибка'}</div>`;return}
  p.innerHTML=r.admins.length?r.admins.map(x=>`<div class="row"><span>${esc(x.name)}${x.username?' @'+esc(x.username):''}</span><button class="btn red sm" data-id="${x.id}">Забрать</button></div>`).join(''):'<div class="empty">Других админов нет</div>';
  p.onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const r2=await adm('admin_del',{id:+b.dataset.id},'Права забраны');if(r2.ok)aTab('alist')}}
 else if(t=='maint'){const r=await api('/api/admin',{act:'maint'});if(!r.ok){p.innerHTML=`<div class="empty">${r.msg||'Ошибка'}</div>`;return}
  p.innerHTML=box(`<div>Сейчас: <b>${r.on?'ВКЛЮЧЕНЫ (играть может только владелец)':'выключены'}</b></div><button class="btn ${r.on?'green':'red'}" id="ago" style="margin-top:6px">${r.on?'Выключить тех. работы':'Включить тех. работы'}</button>`);
  $('#ago').onclick=async()=>{const r2=await adm('maint',{on:!r.on},r.on?'Тех. работы выключены':'Тех. работы включены');if(r2.ok)aTab('maint')}}}

 if(!inTG){fatal('✈️','Открой через Telegram','Игра работает только внутри Telegram.');return}

 ME=r.me||{};S.bal=r.bal;S.inv=r.inv;S.freeAt=r.freeAt||0;setBal(false);go(0);
