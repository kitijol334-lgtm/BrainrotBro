function slot(sel,i,l){$(sel).innerHTML=i?`${img(i.img)}<span>${i.name}</span><em>${fmt(i.v)}</em>`:`<span class="plus">+</span><span>${l}</span>`}
function setWheel(ch,gold){const arc=2*Math.PI*82;$('#gArc').setAttribute('stroke-dasharray',`${arc*ch/100} ${arc}`);$('#gold').setAttribute('stroke-dasharray',gold?`${arc*.05} ${arc}`:`0 ${arc}`)}
function renderUp(){
 const sv=sVal();if(up.t&&(!sv||BY[up.t].v<=sv||!okCh(chOf(sv,BY[up.t].v))))up.t=null;
 const si=sItem(),ti=BY[up.t],ok=si&&ti,ch=ok?chOf(sv,ti.v):0,good=ok&&okCh(ch);
 $('#wPct').textContent=ok?ch+'%':'?';$('#wPct').classList.toggle('bad',ok&&!good);$('#wSm').textContent=ok&&!good?'нельзя':'шанс';setWheel(ch,false);$('#wheel').classList.toggle('empty',!ok);
 slot('#sS',si,'Ставка');slot('#sT',ti,'Цель');$('#mult').textContent=ok?'x'+(+(ti.v/sv).toFixed(2)):'';
 $('#upBtn').classList.toggle('off',!good);[0,1,2].forEach(k=>$('#p'+k).classList.toggle('on',up.pane==k));
 let h='';
 if(up.pane==0){const inv=Object.keys(S.inv).filter(k=>S.inv[k]>0&&BY[k]).map(k=>BY[k]).sort((a,b)=>a.v-b.v);
  h=inv.length?inv.map(i=>card(i,`<u>×${S.inv[i.id]}</u>`,up.s&&up.s.k=='i'&&up.s.id==i.id?'sel':'')).join(''):'<div class="empty">У тебя пока нет брейнротов.<br>Открой кейс — они появятся тут!</div>'}
 else if(up.pane==1)h=`<div class="cp"><div class="sub" style="margin:0">Баланс: ${fmt(S.bal)}. Минимум ${CFG.MIN_COIN}. Монеты можно ставить только на брейнротов.</div><input id="cIn" type="number" inputmode="numeric" min="${CFG.MIN_COIN}" value="${up.s&&up.s.k=='c'?up.s.n:up.coins}"><div class="chips">${[5,10,25,50].map(n=>`<button class="chip" data-n="${n}">${n}</button>`).join('')}<button class="chip" data-n="${S.bal}">Всё</button></div><button class="btn blue" id="cOk">Поставить монеты</button></div>`;
 else if(!si)h='<div class="empty">Сначала выбери ставку — тогда покажу подходящие цели.</div>';
 else{const l=targets(sv);h=l.length?l.map(i=>card(i,`<s>${chOf(sv,i.v)}%</s>`,up.t==i.id?'sel':'')).join(''):'<div class="empty">Для этой ставки нет целей с шансом от 1% до 60%.</div>'}
 $('#pick').innerHTML=h}
$('#sS').onclick=()=>{up.pane=up.s&&up.s.k=='c'?1:0;renderUp()};$('#sT').onclick=()=>{up.pane=2;renderUp()};[0,1,2].forEach(k=>$('#p'+k).onclick=()=>{up.pane=k;renderUp()});
$('#pick').onclick=e=>{if(busy)return;
 const c=e.target.closest('.ic');if(c){const id=c.dataset.id;if(up.pane==0){up.s={k:'i',id};up.pane=2}else up.t=id;hap();renderUp();return}
 const ch=e.target.closest('.chip');if(ch){$('#cIn').value=ch.dataset.n;return}
 if(e.target.id=='cOk'){const n=Math.floor(+$('#cIn').value);if(!(n>=CFG.MIN_COIN)){toast('Минимум '+CFG.MIN_COIN+' монет');return}if(n>S.bal){toast('Не хватает монет');return}up.coins=n;up.s={k:'c',n};up.pane=2;hap();renderUp()}};
$$('.qb').forEach(b=>b.onclick=()=>{if(busy)return;const sv=sVal();if(!sv){toast('Сначала выбери ставку');return}
 const l=targets(sv);if(!l.length){toast('Для этой ставки нет подходящих целей');return}const w=+b.dataset.p;let best=l[0];l.forEach(i=>{if(Math.abs(chOf(sv,i.v)-w)<Math.abs(chOf(sv,best.v)-w))best=i});
 up.t=best.id;up.pane=2;hap();renderUp()});
async function turn(to,ms){const nd=$('#needle'),t=ang+2160+(((to-ang)%360)+360)%360;
 const an=nd.animate([{transform:`rotate(${ang}deg)`},{transform:`rotate(${t}deg)`}],{duration:ms,easing:'cubic-bezier(.15,.6,.1,1)',fill:'forwards'});
 await an.finished.catch(()=>{});ang=t%360;nd.style.transform=`rotate(${ang}deg)`;an.cancel()}
function pickAngle(ch,gold,hit,won){const a=ch*3.6,G0=160,G1=200;
 if(hit)return 166+rnd()*28;
 for(let i=0;i<60;i++){const x=won?a*(.08+.84*rnd()):a+(360-a)*(.08+.84*rnd());if(!(gold&&x>G0&&x<G1))return x}
 return won?a*.1:a+(360-a)*.1}
$('#upBtn').onclick=async()=>{
 if(busy)return;const sv=sVal(),t=BY[up.t];
 if(!sv||!t){shake($('#upBtn'));toast('Выбери ставку и цель');return}
 const ch=chOf(sv,t.v);if(!okCh(ch)){shake($('#upBtn'));toast('Шанс должен быть от 1% до 60%');return}
 if(up.s.k=='c'&&up.s.n>S.bal){toast('Не хватает монет');return}if(up.s.k=='i'&&!S.inv[up.s.id]){toast('Этого брейнрота уже нет');up.s=null;renderUp();return}

 try{

  if(!r.ok){toast(r.msg||'Ошибка');busy=false;$('#pgU').classList.remove('lock');return}

   if(k>0){const g=$('#gb');g.classList.remove('on');void g.offsetWidth;g.classList.add('on');hap('heavy');await sleep(1400)}
   w.classList.add('spin');
   await turn(pickAngle(sp.ch,sp.gold,sp.hit,sp.won),k?CFG.BONUS_MS:CFG.UP_MS);
w.classList.remove('spin');w.classList.add(sp.hit?'g':sp.won?'w':'l');hap(sp.won||sp.hit?'heavy':'rigid');await sleep(900);w.classList.remove('w','l','g')}
  const win=r.result=='win',item=win?BY[r.item]:stakeItem,chain=r.spins.length>1;
  up.s=up.t=null;up.pane=0;
reveal({tone:r.result=='lose'?'lose':'drop',title:win?(chain?'Золотой куш! Победа!':'Победа!'):r.result=='saved'?'Золотой куш спас!':'Ставка сгорела',item,
   sub:win?(chain?`Цепочка апгрейдов: ${r.spins.length-1} 🎰`:'Апгрейд удался — брейнрот в инвентаре'):r.result=='saved'?'Ты ничего не потерял':'Не повезло, попробуй ещё раз',
   btns:[['Ок','green',()=>{closeRv();renderUp();setBal(true)}]]});
 }catch(e){console.error(e)}
 busy=false;$('#pgU').classList.remove('lock')};

 else if(t=='aadd'){p.innerHTML=box(f('Никнейм игрока','a1','@username')+'<button class="btn green" id="ago" style="margin-top:6px">Выдать админку</button>');$('#ago').onclick=async()=>{const r=await adm('admin_add',{nick:v('a1')},'Админка выдана');if(r.ok)$('#a1').value=''}}
